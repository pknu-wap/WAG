# 로컬 개발용 인프라 (MySQL + Kafka). 앱(client/server)은 포함하지 않습니다.
#
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down      # 데이터 유지
#   docker compose -f docker-compose.local.yml down -v   # 데이터까지 삭제
#
# `docker compose` 플러그인이 없는 환경(colima 등)은 `brew install docker-compose` 하거나 아래 docker run 을 그대로 쓰세요.
#   docker run -d --name wag-mysql -p 3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=wag mysql:8.0
#   docker run -d --name wag-kafka -p 9092:9092 <아래 kafka.environment 를 -e 로> apache/kafka:3.7.0
# colima x86_64 에뮬레이션에서는 mysql:8.0 이 "CPU does not support x86-64-v2" 로 죽으므로 mysql:5.7 로 바꾸세요.
#
# 백엔드 설정(application.properties)은 아래 주소를 바라보면 됩니다.
#   spring.datasource.url=jdbc:mysql://localhost:3306/wag?createDatabaseIfNotExist=true
#   spring.kafka.bootstrap-servers=localhost:9092

services:
  mysql:
    image: mysql:8.0
    container_name: wag-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: wag
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - wag-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # KRaft 단일 노드 (Zookeeper 불필요). 운영 환경은 kafka + zookeeper 컨테이너를 씁니다.
    image: apache/kafka:3.7.0
    container_name: wag-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  wag-mysql-data:
