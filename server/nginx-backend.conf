# WAG Backend Nginx Configuration
# 파일 위치: /etc/nginx/sites-available/wag-backend
# 심볼릭 링크: /etc/nginx/sites-enabled/wag-backend

upstream wag_backend {
    server localhost:18080;  # Blue/Green 포트 (Jenkins가 자동 업데이트)
}

server {
    listen 5000;
    server_name _;

    # 액세스 로그
    access_log /var/log/nginx/wag-backend-access.log;
    error_log /var/log/nginx/wag-backend-error.log;

    # WebSocket 지원
    location /ws {
        proxy_pass http://wag_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 일반 HTTP 요청
    location / {
        proxy_pass http://wag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 헬스체크 엔드포인트 (모니터링용)
    location /actuator/health {
        proxy_pass http://wag_backend;
        access_log off;
    }
}

